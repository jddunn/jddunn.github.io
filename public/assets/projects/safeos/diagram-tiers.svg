<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="12">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121f"/>
    </linearGradient>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <marker id="tar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="url(#tbg)" rx="12"/>

  <text x="450" y="36" fill="#e2e8f0" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="2">THREE-TIER AI ESCALATION</text>
  <line x1="280" y1="46" x2="620" y2="46" stroke="#10b981" stroke-width="1" opacity="0.5"/>
  <text x="450" y="65" fill="#94a3b8" font-size="10" text-anchor="middle" font-style="italic">Each frame starts in Tier 1 — only escalates when a concern is detected</text>

  <!-- Frame input -->
  <rect x="30" y="90" width="130" height="44" rx="5" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="1"/>
  <text x="95" y="108" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">Camera Frame</text>
  <text x="95" y="124" fill="#a5b4fc" font-size="9" text-anchor="middle">30-60 fps input</text>

  <line x1="160" y1="112" x2="195" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tar)"/>

  <!-- Tier 1 box -->
  <rect x="200" y="76" width="680" height="94" rx="8" fill="url(#t1)" opacity="0.12" stroke="url(#t1)" stroke-width="1.5"/>
  <rect x="200" y="76" width="680" height="26" rx="8" fill="url(#t1)" opacity="0.3"/>
  <text x="540" y="95" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">TIER 1 · BROWSER (always on · 0ms network · ~$0/month)</text>

  <rect x="216" y="110" width="160" height="50" rx="4" fill="#052e16" opacity="0.5" stroke="#34d399" stroke-width="0.8"/>
  <text x="296" y="128" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">COCO-SSD</text>
  <text x="296" y="142" fill="#6ee7b7" font-size="8" text-anchor="middle">~5MB · ~50ms</text>
  <text x="296" y="154" fill="#6ee7b7" font-size="8" text-anchor="middle">object detection</text>

  <rect x="386" y="110" width="160" height="50" rx="4" fill="#052e16" opacity="0.5" stroke="#34d399" stroke-width="0.8"/>
  <text x="466" y="128" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">ViT-base (TF.js)</text>
  <text x="466" y="142" fill="#6ee7b7" font-size="8" text-anchor="middle">~89MB · ~150ms</text>
  <text x="466" y="154" fill="#6ee7b7" font-size="8" text-anchor="middle">scene classification</text>

  <rect x="556" y="110" width="160" height="50" rx="4" fill="#052e16" opacity="0.5" stroke="#34d399" stroke-width="0.8"/>
  <text x="636" y="128" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Motion + Audio</text>
  <text x="636" y="142" fill="#6ee7b7" font-size="8" text-anchor="middle">pixel-diff, FFT</text>
  <text x="636" y="154" fill="#6ee7b7" font-size="8" text-anchor="middle">cry / fall / bark</text>

  <rect x="726" y="110" width="140" height="50" rx="4" fill="#052e16" opacity="0.5" stroke="#34d399" stroke-width="0.8"/>
  <text x="796" y="128" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">Lost &amp; Found</text>
  <text x="796" y="142" fill="#6ee7b7" font-size="8" text-anchor="middle">color histogram</text>
  <text x="796" y="154" fill="#6ee7b7" font-size="8" text-anchor="middle">edge signature</text>

  <!-- Decision gate -->
  <line x1="540" y1="170" x2="540" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tar)"/>
  <text x="548" y="187" fill="#94a3b8" font-size="9">concern detected?</text>

  <polygon points="490,200 590,200 540,240" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
  <text x="540" y="218" fill="#c7d2fe" font-size="9" text-anchor="middle" font-weight="bold">ESCALATE</text>
  <text x="540" y="230" fill="#a5b4fc" font-size="8" text-anchor="middle">gate</text>

  <!-- Gate no: back to idle -->
  <path d="M 490 220 L 220 220" stroke="#34d399" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="320" y="213" fill="#34d399" font-size="9" opacity="0.7">NO → archive, next frame</text>

  <!-- Gate yes: down -->
  <line x1="540" y1="240" x2="540" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tar)"/>
  <text x="560" y="258" fill="#fbbf24" font-size="9">YES</text>

  <!-- Tier 2 -->
  <rect x="50" y="275" width="810" height="82" rx="8" fill="url(#t2)" opacity="0.12" stroke="url(#t2)" stroke-width="1.5"/>
  <rect x="50" y="275" width="810" height="24" rx="8" fill="url(#t2)" opacity="0.3"/>
  <text x="455" y="292" fill="#fde68a" font-size="12" font-weight="bold" text-anchor="middle">TIER 2 · LOCAL OLLAMA (user-hosted · privacy-preserving · ~$0/month)</text>

  <rect x="64" y="305" width="260" height="44" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="194" y="321" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">moondream (triage)</text>
  <text x="194" y="337" fill="#fcd34d" font-size="8" text-anchor="middle">~1.7GB · ~500ms · "is this concerning?"</text>

  <rect x="334" y="305" width="260" height="44" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="464" y="321" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">llava:7b (detail)</text>
  <text x="464" y="337" fill="#fcd34d" font-size="8" text-anchor="middle">~4GB · 2-5s · scenario-specific prompts</text>

  <rect x="604" y="305" width="256" height="44" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="732" y="321" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">llama3.2-vision:11b</text>
  <text x="732" y="337" fill="#fcd34d" font-size="8" text-anchor="middle">~7GB · 5-10s · complex reasoning</text>

  <!-- Arrow down to tier 3 -->
  <line x1="450" y1="357" x2="450" y2="380" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tar)"/>
  <text x="470" y="372" fill="#f472b6" font-size="9">ambiguous case</text>

  <!-- Tier 3 -->
  <rect x="50" y="385" width="810" height="70" rx="8" fill="url(#t3)" opacity="0.12" stroke="url(#t3)" stroke-width="1.5"/>
  <rect x="50" y="385" width="810" height="22" rx="8" fill="url(#t3)" opacity="0.3"/>
  <text x="455" y="401" fill="#fbcfe8" font-size="12" font-weight="bold" text-anchor="middle">TIER 3 · CLOUD FALLBACK (opt-in · rate-limited · redacted frames only)</text>

  <rect x="80" y="414" width="240" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#f472b6" stroke-width="0.6"/>
  <text x="200" y="434" fill="#fbcfe8" font-size="10" font-weight="bold" text-anchor="middle">Gemini Flash (OpenRouter)</text>

  <rect x="330" y="414" width="240" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#f472b6" stroke-width="0.6"/>
  <text x="450" y="434" fill="#fbcfe8" font-size="10" font-weight="bold" text-anchor="middle">GPT-4o-mini (OpenAI)</text>

  <rect x="580" y="414" width="240" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#f472b6" stroke-width="0.6"/>
  <text x="700" y="434" fill="#fbcfe8" font-size="10" font-weight="bold" text-anchor="middle">Claude 3 Haiku (Anthropic)</text>
</svg>
