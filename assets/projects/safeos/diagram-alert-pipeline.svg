<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="12">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121f"/>
    </linearGradient>
    <linearGradient id="asev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="33%" style="stop-color:#fbbf24"/>
      <stop offset="66%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <marker id="aar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#abg)" rx="12"/>

  <text x="450" y="36" fill="#e2e8f0" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="2">ALERT ESCALATION PIPELINE</text>
  <line x1="290" y1="46" x2="610" y2="46" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <text x="450" y="63" fill="#94a3b8" font-size="10" text-anchor="middle" font-style="italic">5-level volume ramp over 120 seconds until acknowledged</text>

  <!-- Time axis -->
  <line x1="80" y1="120" x2="840" y2="120" stroke="#334155" stroke-width="1"/>
  <text x="80" y="140" fill="#94a3b8" font-size="9">0s</text>
  <text x="230" y="140" fill="#94a3b8" font-size="9">30s</text>
  <text x="380" y="140" fill="#94a3b8" font-size="9">60s</text>
  <text x="530" y="140" fill="#94a3b8" font-size="9">90s</text>
  <text x="680" y="140" fill="#94a3b8" font-size="9">120s</text>
  <text x="800" y="140" fill="#f87171" font-size="9" font-weight="bold">escalate</text>

  <!-- Level bars (volume ramp) -->
  <rect x="80" y="160" width="130" height="32" rx="3" fill="#10b981" opacity="0.3" stroke="#34d399" stroke-width="0.8"/>
  <text x="145" y="178" fill="#a7f3d0" font-size="10" text-anchor="middle" font-weight="bold">LEVEL 1</text>
  <text x="145" y="190" fill="#6ee7b7" font-size="8" text-anchor="middle">volume 30%</text>

  <rect x="220" y="160" width="130" height="32" rx="3" fill="#fbbf24" opacity="0.3" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="285" y="178" fill="#fde68a" font-size="10" text-anchor="middle" font-weight="bold">LEVEL 2</text>
  <text x="285" y="190" fill="#fcd34d" font-size="8" text-anchor="middle">volume 50%</text>

  <rect x="360" y="160" width="130" height="32" rx="3" fill="#f97316" opacity="0.3" stroke="#f97316" stroke-width="0.8"/>
  <text x="425" y="178" fill="#fed7aa" font-size="10" text-anchor="middle" font-weight="bold">LEVEL 3</text>
  <text x="425" y="190" fill="#fdba74" font-size="8" text-anchor="middle">volume 70%</text>

  <rect x="500" y="160" width="130" height="32" rx="3" fill="#dc2626" opacity="0.3" stroke="#f87171" stroke-width="0.8"/>
  <text x="565" y="178" fill="#fecaca" font-size="10" text-anchor="middle" font-weight="bold">LEVEL 4</text>
  <text x="565" y="190" fill="#fca5a5" font-size="8" text-anchor="middle">volume 90%</text>

  <rect x="640" y="160" width="200" height="32" rx="3" fill="#7f1d1d" opacity="0.5" stroke="#f87171" stroke-width="1"/>
  <text x="740" y="178" fill="#fecaca" font-size="10" text-anchor="middle" font-weight="bold">LEVEL 5 · MAX</text>
  <text x="740" y="190" fill="#fca5a5" font-size="8" text-anchor="middle">volume 100% · emergency escalation</text>

  <!-- Trigger and response paths -->
  <text x="80" y="228" fill="#c7d2fe" font-size="11" font-weight="bold">TRIGGER SOURCES</text>

  <rect x="80" y="238" width="160" height="42" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="0.8"/>
  <text x="160" y="254" fill="#c7d2fe" font-size="10" text-anchor="middle" font-weight="bold">Motion</text>
  <text x="160" y="268" fill="#a5b4fc" font-size="8" text-anchor="middle">pixel delta above threshold</text>

  <rect x="250" y="238" width="160" height="42" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="0.8"/>
  <text x="330" y="254" fill="#c7d2fe" font-size="10" text-anchor="middle" font-weight="bold">Audio</text>
  <text x="330" y="268" fill="#a5b4fc" font-size="8" text-anchor="middle">cry / fall / bark / volume</text>

  <rect x="420" y="238" width="160" height="42" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="0.8"/>
  <text x="500" y="254" fill="#c7d2fe" font-size="10" text-anchor="middle" font-weight="bold">AI Detection</text>
  <text x="500" y="268" fill="#a5b4fc" font-size="8" text-anchor="middle">person, animal, scene</text>

  <rect x="590" y="238" width="160" height="42" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="0.8"/>
  <text x="670" y="254" fill="#c7d2fe" font-size="10" text-anchor="middle" font-weight="bold">Lost &amp; Found</text>
  <text x="670" y="268" fill="#a5b4fc" font-size="8" text-anchor="middle">fingerprint match</text>

  <rect x="760" y="238" width="80" height="42" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="800" y="254" fill="#c7d2fe" font-size="10" text-anchor="middle" font-weight="bold">Webhook</text>
  <text x="800" y="268" fill="#a5b4fc" font-size="8" text-anchor="middle">remote</text>

  <!-- Arrows converging -->
  <line x1="160" y1="280" x2="310" y2="308" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="330" y1="280" x2="390" y2="308" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="500" y1="280" x2="470" y2="308" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="670" y1="280" x2="540" y2="308" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

  <!-- Severity classifier -->
  <rect x="260" y="308" width="380" height="40" rx="4" fill="url(#asev)" opacity="0.2" stroke="#818cf8" stroke-width="1"/>
  <text x="450" y="325" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">SEVERITY CLASSIFIER · content-filter · per-severity cooldowns</text>
  <text x="450" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">info (5s) | low (10s) | med (30s) | high (60s) | crit (0s)</text>

  <line x1="450" y1="348" x2="450" y2="368" stroke="#818cf8" stroke-width="1.5" marker-end="url(#aar)"/>

  <!-- Delivery row -->
  <rect x="80" y="370" width="120" height="32" rx="4" fill="#052e16" opacity="0.4" stroke="#34d399" stroke-width="0.8"/>
  <text x="140" y="390" fill="#a7f3d0" font-size="9" text-anchor="middle" font-weight="bold">Audio Alarm</text>

  <rect x="208" y="370" width="120" height="32" rx="4" fill="#052e16" opacity="0.4" stroke="#34d399" stroke-width="0.8"/>
  <text x="268" y="390" fill="#a7f3d0" font-size="9" text-anchor="middle" font-weight="bold">Web Push</text>

  <rect x="336" y="370" width="120" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="396" y="390" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="bold">Twilio SMS</text>

  <rect x="464" y="370" width="120" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="524" y="390" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="bold">Telegram Bot</text>

  <rect x="592" y="370" width="120" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="652" y="390" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="bold">Email</text>

  <rect x="720" y="370" width="120" height="32" rx="4" fill="#1e1b4b" opacity="0.4" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="780" y="390" fill="#fde68a" font-size="9" text-anchor="middle" font-weight="bold">Capacitor Push</text>
</svg>
